<script type="text/html" data-help-name="ha-api"><p>The API node provides access to all points of the Home Assistant WebSocket and HTTP API. This enables you to interact programmatically with Home Assistant, sending and receiving data through these protocols. It’s a powerful tool for integrating third-party systems, custom automations, or advanced control within Node-RED, offering full access to Home Assistant's core functionalities.</p><h3>Config</h3><dl class="message-properties"><dt>Protocol <span text="required" class="home-assistant-badge">required</span><span class="property-type">string</span></dt><ul><li>Values: <code>websocket|http</code></li><li>Default: <code>websocket</code></li></ul><dd>Protocol to use to access Home Assistant API.</dd><dt>Method<span class="property-type">string</span></dt><ul><li>Values: <code>get|post</code></li></ul><dd>Type of method to use to access the HTTP endpoint.</dd><dt>Path<span class="property-type">string</span></dt><ul><li>Accepts <a href="https://zachowj.github.io/node-red-contrib-home-assistant-websocket/guide/mustache-templates.html" rel="noopener noreferrer">Mustache Templates</a></li></ul><dd>URL of the API endpoint.</dd><dt>Params<span class="property-type">Object</span></dt><ul><li>Accepts <a href="https://zachowj.github.io/node-red-contrib-home-assistant-websocket/guide/mustache-templates.html" rel="noopener noreferrer">Mustache Templates</a></li></ul><dd>A JSON object with key/value pairs that will be converted into URL parameters.</dd><dt>Data<span class="property-type">Object</span></dt><ul><li>Accepts <a href="https://zachowj.github.io/node-red-contrib-home-assistant-websocket/guide/mustache-templates.html" rel="noopener noreferrer">Mustache Templates</a> when the data type is JSON</li></ul><dd>JSON Object to send for WebSocket requests and HTTP posts.</dd><dt>Results<span class="property-type">string</span></dt></dl><h3>Input</h3><dl class="message-properties"><dd>All properties need to be under <code>msg.payload</code>.</dd><dt>protocol<span class="property-type">string</span></dt><ul><li>Values: <code>websocket|http</code></li></ul><dd>Overrides or sets the protocol property of the config.</dd><dt>method<span class="property-type">string</span></dt><ul><li>Values: <code>get|post</code></li></ul><dd>Overrides or sets the method property of the config.</dd><dt>path<span class="property-type">string</span></dt><dd>Overrides or sets the path property of the config.</dd><dt>data<span class="property-type">Object|string</span></dt><dd>Overrides or sets the data/params property of the config.</dd><dt>location<span class="property-type">string</span></dt><dd>Overrides or sets the results property of the config.</dd><dt>locationType<span class="property-type">string</span></dt><ul><li>Values: <code>msg|flow|global</code></li></ul><dd>Overrides or sets the results type property of the config.</dd></dl><h3>Output</h3><dl class="message-properties"><dd>Value types:</dd><ul><li><code>results</code>: results of the API request</li><li><code>config</code>: config properties of the node</li></ul></dl><h3>References</h3><dl class="message-properties"><ul><li><a href="https://developers.home-assistant.io/docs/api/rest">http api</a></li><li><a href="https://developers.home-assistant.io/docs/api/websocket">websocket api</a></li></ul></dl></script>
<script type="text/html" data-help-name="api-call-service"><p>This node allows you to send a request to Home Assistant to perform specific actions. These actions could include tasks such as turning on a light (<code>light.turn_on</code>), selecting an option from a dropdown menu (<code>input_select.select_option</code>), or any other service call supported by Home Assistant. It serves as a bridge between Node-RED and Home Assistant, enabling automation flows to directly control devices or entities in your smart home setup.</p><div class="home-assistant-custom-block tip"><p class="custom-block-title">Helpful Examples</p><p><a href="https://zachowj.github.io/node-red-contrib-home-assistant-websocket/guide/action.html" rel="noopener noreferrer">Action Tips and Tricks</a></p></div><h3>Configuration</h3><dl class="message-properties"><dt>Action <span text="required" class="home-assistant-badge">required</span><span class="property-type">string</span></dt><ul><li>Accepts <a href="https://zachowj.github.io/node-red-contrib-home-assistant-websocket/guide/mustache-templates.html" rel="noopener noreferrer">Mustache Templates</a></li></ul><dd>Action to perform</dd><dt>Floor<span class="property-type">an array of floor ids</span></dt><ul><li>Accepts <a href="https://zachowj.github.io/node-red-contrib-home-assistant-websocket/guide/mustache-templates.html" rel="noopener noreferrer">Mustache Templates</a> for ids</li></ul><dd>A list of floor ids that will be used as targets for the action</dd><dt>Area<span class="property-type">an array of area ids</span></dt><ul><li>Accepts <a href="https://zachowj.github.io/node-red-contrib-home-assistant-websocket/guide/mustache-templates.html" rel="noopener noreferrer">Mustache Templates</a> for ids</li></ul><dd>A list of area ids that will be used as targets for the action</dd><dd>Custom ids can be inserted into the list by adding a <code>#</code> at the end of the id</dd><dt>Device<span class="property-type">an array of device ids</span></dt><ul><li>Accepts <a href="https://zachowj.github.io/node-red-contrib-home-assistant-websocket/guide/mustache-templates.html" rel="noopener noreferrer">Mustache Templates</a> for ids</li></ul><dd>A list of device ids that will be used as targets for the action</dd><dd>Custom ids can be inserted into the list by adding a <code>#</code> at the end of the id</dd><dt>Entity<span class="property-type">an array of entity ids</span></dt><ul><li>Accepts <a href="https://zachowj.github.io/node-red-contrib-home-assistant-websocket/guide/mustache-templates.html" rel="noopener noreferrer">Mustache Templates</a> for ids</li></ul><dd>A list of entity ids that will be used as targets for the action</dd><dt>Label<span class="property-type">an array of label ids</span></dt><ul><li>Accepts <a href="https://zachowj.github.io/node-red-contrib-home-assistant-websocket/guide/mustache-templates.html" rel="noopener noreferrer">Mustache Templates</a> for ids</li></ul><dd>A list of label ids that will be used as targets for the action</dd><dt>Data<span class="property-type">JSONata | JSON</span></dt><ul><li>Accepts <a href="https://zachowj.github.io/node-red-contrib-home-assistant-websocket/guide/mustache-templates.html" rel="noopener noreferrer">Mustache Templates</a> when data type is JSON</li></ul><dd>JSON object to pass along.</dd><dt>Merge Context<span class="property-type">string</span></dt><dd>If defined will attempt to merge the global and flow context variable into the config</dd><dt>Alternative Template Tags<span class="property-type">boolean</span></dt><dd>Will change the tags used for the mustache template to <code>&lt;%</code> and <code>%&gt;</code></dd><dt>Queue<span class="property-type">none | first | all | last</span></dt><dd>Will store the first, last, or all messages received while disconnected from Home Assistant and send them once connected again</dd><dt>Block Input Overrides<span class="property-type">boolean</span></dt><ul><li>Default: <code>true</code></li></ul><dd>Stop <code>msg.payload</code> values from overriding local config</dd></dl><h3>Input</h3><dl class="message-properties"><dd>All properties need to be under <code>msg.payload</code>.</dd><dd>Sample input</dd><pre><code class="language-JSON">{
    "action": "homeassistant.turn_on",
    "target": {
        "floor_id": ["first_floor"],
        "area_id": ["kitchen"],
        "device_id": ["8932894082930482903"],
        "entity_id": ["light.kitchen", "switch.garage_light"],
        "label_id": ["outdoor_lights"]
    }
    "data": {
        "brightness_pct": 50
    }
}
</code></pre><h5>Merging</h5><dd>If the incoming message has a <code>payload</code> property with <code>action</code> set it will override any config values if set.</dd><dd>If the incoming message has a <code>payload.data</code> that is an object these properties will be <strong>merged</strong> with any config values set.</dd><dd>If the node has a property value in its config for <code>Merge Context</code> then the <code>flow</code> and <code>global</code> contexts will be checked for this property which should be an object that will also be merged into the data payload.</dd><h5>Merge Resolution</h5><dd>As seen above the <code>data</code> property has a lot going on in the way of data merging, in the end, all of these are optional and the rightmost will win if a property exists in multiple objects</dd><dd>Config Data, Global Data, Flow Data, Payload Data ( payload data property always wins if provided )</dd><dt>action<span class="property-type">string</span></dt><dd>Action to call</dd><dt>data<span class="property-type">JSON Object</span></dt><dd>Data to send with the action</dd><dt>target<span class="property-type">JSON Object with floor_id, area_id, device_id, entity_id, and label_id as array properties</span></dt><dd>Targets of the action</dd></dl><h3>Output</h3><dl class="message-properties"><dd>Value types:</dd><ul><li><code>config</code>: config properties of the node</li><li><code>results</code>: response from Home Assistant</li><li><code>sent data</code>: data sent to Home Assistant</li></ul></dl><h3>References</h3><dl class="message-properties"><div><p><a href="https://zachowj.github.io/node-red-contrib-home-assistant-websocket/node/action.html" rel="noopener noreferrer">External Docs</a></p></div></dl></script>
<script type="text/html" data-help-name="ha-binary-sensor"><div class="home-assistant-custom-block warning"><p class="custom-block-title">WARNING</p><p><em>Needs <a href="https://github.com/zachowj/hass-node-red">Custom Integration</a> installed in Home Assistant for this node to function</em></p></div><p>This node allows you to create a binary sensor entity within Home Assistant that can be controlled directly from Node-RED. A binary sensor is a type of entity that has only two possible states: typically "on" or "off". It can represent various real-world conditions, such as whether a door is open or closed, or if motion is detected.</p><h3>Configuration</h3><dl class="message-properties"><dt>State <span text="required" class="home-assistant-badge">required</span><span class="property-type">boolean</span></dt><dd>The state of the entity should be updated to</dd><dd>To set the Home Assistant state to <code>Unknown</code>, send a state with a js expression <code>null</code>.</dd><dt>Attributes<span class="property-type">Object</span></dt><dd>Key/Value pair of attributes to update. The key should be a string and the value can be a [string | number | boolean | object]</dd><dt>Input Override<span class="property-type">string</span></dt><ul><li>Values: <code>accept | merge | block</code></li></ul><dd>Determine how input values will be handled. When merge is selected the message object values will override the configuration values.</dd></dl><h3>Inputs</h3><dl class="message-properties"><dd>properties of <code>msg.payload</code></dd><dt>state<span class="property-type">string | number | boolean</span></dt><dd>The value of the entity state will be updated.</dd><dt>attributes<span class="property-type">Object</span></dt><dd>Key/Value pair of attributes to update. The key should be a string and the value can be a <code>[string | number | boolean | object]</code></dd></dl></script>
<script type="text/html" data-help-name="ha-button"><div class="home-assistant-custom-block warning"><p class="custom-block-title">WARNING</p><p><em>Needs <a href="https://github.com/zachowj/hass-node-red">Custom Integration</a> installed in Home Assistant for this node to function</em></p></div><p>The Button node creates a button entity within Home Assistant that, when pressed, triggers a flow in Node-RED. This is useful for manual triggers within automations, allowing users to start an automation sequence directly from the Home Assistant interface with a simple click.</p><h3>Outputs</h3><dl class="message-properties"><dd>Value types:</dd><ul><li><code>entity</code>: complete entity object</li><li><code>entity id</code>: entity id of the pressed button</li><li><code>entity state</code>: entity state of the pressed button</li><li><code>config</code>: config properties of the node</li></ul></dl></script>
<script type="text/html" data-help-name="server"><p>The <strong>Server Config</strong> node defines how Node-RED connects to your Home Assistant instance. It manages connection details, authentication, and various integration settings to ensure a stable connection between Node-RED and Home Assistant.</p><hr><h3>Connection Settings</h3><dl class="message-properties"><dt>Name<span class="property-type">string</span></dt><dd>A user-defined label for this configuration. This name is also used as the <strong>namespace</strong> for related global context data (see Context).</dd><hr><dt>Using the Home Assistant Add-on<span class="property-type">boolean</span></dt><dd>If you’re running Node-RED as a <strong>Home Assistant Add-on (Hass.io)</strong>, enable this option. No additional configuration (such as URL or access token) is required.</dd><hr><dt>Base URL<span class="property-type">string</span></dt><dd>The base URL and port of your Home Assistant instance.</dd><dd><strong>Examples:</strong></dd><ul><li><code>http://192.168.0.100:8123</code></li><li><code>https://homeassistant.mysite.com</code></li></ul><hr><dt>Access Token<span class="property-type">string</span></dt><dd>A <strong>Long-Lived Access Token</strong> used to authenticate with Home Assistant’s API.</dd><hr><dt>Allow Unauthorized SSL Certificates<span class="property-type">boolean</span></dt><dd>Allows Node-RED to accept <strong>self-signed certificates</strong> when connecting to Home Assistant.</dd><hr><dt>Enable Heartbeat<span class="property-type">boolean</span></dt><dd>Enables periodic <strong>ping</strong> messages sent through the WebSocket connection. If no <strong>pong</strong> response is received within 5 seconds, Node-RED automatically attempts to reconnect.</dd><hr><dt>Heartbeat Interval<span class="property-type">number</span></dt><dd>Specifies how often (in seconds) the heartbeat ping is sent. The <strong>minimum value</strong> is <strong>10 seconds</strong>.</dd><hr></dl><h3>Config Settings</h3><dl class="message-properties"><dt>State Boolean<span class="property-type">array of strings</span></dt><dd>Defines which strings should be interpreted as boolean <code>true</code> when comparing state values.</dd><dd>When configured, state boolean values are normalized by converting to lowercase and trimming whitespace, so <code>"On"</code> and <code>"on"</code> become the same value and duplicates are removed.</dd><dd><strong>Note:</strong> Comparisons with entity states are case-sensitive. Entity states from official Home Assistant integrations are typically lowercase, but user-defined entities (like <code>input_text</code>) may have capitalized values that will not match.</dd><dd><strong>Default values:</strong></dd><pre><code>["y", "yes", "on", "true", "home", "open"]
</code></pre><dd>See <a href="https://zachowj.github.io/node-red-contrib-home-assistant-websocket../node/conditions.html#home-assistant-boolean" rel="noopener noreferrer">Home Assistant Boolean</a> for more details.</dd><hr><dt>Enable Global Context Store<span class="property-type">boolean</span></dt><dd>When enabled, Home Assistant connection data, states, and services are stored in the Node-RED <strong>global context</strong>. This allows other nodes or function nodes to access Home Assistant data directly.</dd><dd><strong>Example:</strong></dd><pre><code class="language-js">const haCtx = global.get("homeassistant");
const configCtx = haCtx.homeAssistant;
const entityState = configCtx.states["switch.my_switch"];
return entityState.state === "on";
</code></pre><hr></dl><h3>UI Settings</h3><dl class="message-properties"><dt>Cache Autocomplete Results<span class="property-type">boolean</span></dt><dd>Caches JSON autocomplete results for faster UI performance.</dd><hr><dt>ID Selector Display<span class="property-type"></span></dt><dd>Determines which text is shown in selectors after an entity ID has been chosen (for example, name, ID, or friendly name).</dd><hr><dt>Status Date Format<span class="property-type"></span></dt><h5>Separator</h5><dd>A string displayed between the <strong>state</strong> and <strong>date</strong> in an event node’s status text.</dd><h5>Additional Options</h5><dd>Supports all standard <a href="https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Intl/DateTimeFormat/DateTimeFormat#options">DateTimeFormat Options</a>.</dd><hr></dl><h3>Details</h3><dl class="message-properties"><dd>Every Home Assistant node in Node-RED must reference a <strong>Server Config</strong> node. This configuration defines how Node-RED connects to and communicates with your Home Assistant instance.</dd><hr><dt>Context<span class="property-type"></span></dt><dd>Each Server Config node also exposes data in the <strong>global context</strong>, using the configuration’s <strong>Name</strong> (converted to camelCase) as the namespace.</dd><dd>The following context values are available:</dd><table><thead><tr><th>Key</th><th>Description</th><th>Update Behavior</th></tr></thead><tbody><tr><td><code>states</code></td><td>All entity states</td><td>Always kept up to date as state changes occur</td></tr><tr><td><code>services</code></td><td>Available Home Assistant services</td><td>Loaded on initial deploy</td></tr><tr><td><code>events</code></td><td>Available Home Assistant events</td><td>Loaded on initial deploy</td></tr></tbody></table><hr><dt>Context Example<span class="property-type"></span></dt><dd>If your Server Config node is named <strong>Home Assistant</strong> and you have an entity <code>switch.my_switch</code>, you can access its state with:</dd><pre><code class="language-js">const haCtx = global.get("homeassistant");
const configCtx = haCtx.homeAssistant;
const entityState = configCtx.states["switch.my_switch"];
return entityState.state === "on";
</code></pre><hr></dl><h3>Connection Issues</h3><dl class="message-properties"><dd>Node-RED communicates with Home Assistant using both the <strong>WebSocket</strong> and <strong>REST API</strong>.</dd><dd>If you encounter connection issues:</dd><ol><li><p>Verify that the Home Assistant API is accessible <strong>from the same host</strong> running Node-RED.</p></li><li><p>Test the connection using a REST client or command line:</p><pre><code class="language-bash">curl -H "Authorization: Bearer &lt;YOUR_LONG_LIVED_ACCESS_TOKEN&gt;" \
     http://&lt;home_assistant_host&gt;:8123/api/
</code></pre></li><li><p>Confirm that your <strong>Base URL</strong> and <strong>Access Token</strong> are correct.</p></li><li><p>Review the Node-RED logs for any connection or authentication errors.</p></li></ol><hr></dl><h3>References</h3><dl class="message-properties"><ul><li><a href="https://home-assistant.io/developers/rest_api">Home Assistant REST API</a></li><li><a href="https://developers.home-assistant.io/docs/auth_api/#long-lived-access-token">Home Assistant Long-Lived Access Tokens</a></li><li><a href="https://nodered.org/docs/user-guide/context">Node-RED Context Documentation</a></li></ul></dl></script>
<script type="text/html" data-help-name="api-current-state"><p>This node is used to fetch the last known state of any entity within Home Assistant when it receives an input. It’s useful for making decisions based on the current status of entities, such as checking if a light is already on before turning it off, or determining the temperature reading before adjusting the thermostat.</p><h3>Configuration</h3><dl class="message-properties"><dt>Entity ID <span text="required" class="home-assistant-badge">required</span><span class="property-type">string</span></dt><ul><li>Accepts <a href="https://zachowj.github.io/node-red-contrib-home-assistant-websocket/guide/mustache-templates.html" rel="noopener noreferrer">Mustache Templates</a></li></ul><dd>The id of the entity to return.</dd><dt>If State<span class="property-type">string</span></dt><dd>If the conditional statement is evaluated as true send the message to the first output otherwise send it to the second output. If blank there will only be one output.</dd><dd><strong>Also see:</strong></dd><ul><li><a href="https://zachowj.github.io/node-red-contrib-home-assistant-websocket/guide/conditionals.html" rel="noopener noreferrer">Conditionals</a></li></ul><dt>For<span class="property-type">number</span></dt><dd>The amount of time the entity state needs to have been constant for the "If state" to be <code>true</code></dd><dt>State Type<span class="property-type"></span></dt><div class="home-assistant-custom-block warning"><p class="custom-block-title">DEPRECATED</p><p>This feature is being phased out and will be removed in version <strong>1.0.0</strong>.<br>Use the <strong>output properties</strong> for state conversion moving forward.</p></div><ul><li>Type: <code>string</code></li><li>Values: <code>string|number|boolean</code></li><li>Default: <code>string</code></li></ul><dd>Convert the state of the entity to the selected type. Boolean will be converted to true based on if the string is equal by default to (<code>y|yes|true|on|home|open</code>). Original value stored in <code>msg.data.original_state</code></dd><dt>Block Input Overrides<span class="property-type">boolean</span></dt><ul><li>Default: <code>false</code></li></ul><dd>Stop <code>msg.payload</code> values from overriding local config</dd></dl><h3>Inputs</h3><dl class="message-properties"><dt>payload.entityId<span class="property-type">string</span></dt></dl><h3>Outputs</h3><dl class="message-properties"><dd>Value types:</dd><ul><li><code>entity</code>: full entity object</li><li><code>entity id</code>: entity id of the triggered entity</li><li><code>entity state</code>: entity state of the triggered entity</li><li><code>config</code>: config properties of the node</li></ul></dl><h3>References</h3><dl class="message-properties"><ul><li><a href="https://home-assistant.io/docs/configuration/state_object/">Home Assistant State Objects</a></li></ul></dl></script>
<script type="text/html" data-help-name="ha-device-config"><p>The Device Config node is used for configuring devices that have been added to Home Assistant. It allows you to set up and manage device-specific settings and options within Node-RED, ensuring that your automations can correctly interact with your devices.</p><h3>Configuration</h3><dl class="message-properties"><dt>Name<span class="property-type">string</span></dt><dd>The name of the device that will show in Home Assistant</dd><dt>Manufacturer<span class="property-type">string</span></dt><dd>The manufacturer of the device</dd><dt>Model<span class="property-type">string</span></dt><dd>The model of the device</dd><dt>Software Version<span class="property-type">string</span></dt><dd>The software version of the device</dd><dt>Hardware Version<span class="property-type">string</span></dt><dd>The hardware version of the device</dd></dl></script>
<script type="text/html" data-help-name="ha-device"><p>The Device node enables you to create device automations and call device actions within Home Assistant. This node interacts with devices connected to your Home Assistant instance, allowing you to perform tasks such as turning devices on or off, changing settings, or triggering specific device-related actions.</p><h3>Configuration</h3><dl class="message-properties"><dt>Type<span class="property-type">string</span></dt><ul><li>Values: <code>trigger | action</code></li></ul><dt>Device<span class="property-type">string</span></dt><dd>Id of the device</dd><dt>Trigger<span class="property-type">object</span></dt><dd>Home Assistant object of the trigger</dd><dt>Action<span class="property-type">object</span></dt><dd>Home Assistant object of the action</dd><dt>Capabilities<span class="property-type">object</span></dt></dl><!-- @include: @snippets/node/expose-as.md --><h3>Outputs</h3><dl class="message-properties"><dd>Value types:</dd><ul><li><code>config</code>: config properties of the node</li><li><code>device id</code>: device id that triggered the node</li><li><code>event data</code>: event data received from Home Assistant</li><li><code>sent data</code>: data sent to Home Assistant</li></ul></dl></script>
<script type="text/html" data-help-name="ha-entity-config"><p>The Entity Config node provides configuration options for the different entity type nodes within Node-RED. It’s used to set up and manage the properties and settings for entities, ensuring they behave as expected within your automations and Home Assistant environment.</p><h3>Configuration</h3><dl class="message-properties"><dt>Name<span class="property-type">string</span></dt><dd>The name of the entity that will show in Node-RED</dd><dt>Device<span class="property-type">string</span></dt><ul><li><a href="https://zachowj.github.io/node-red-contrib-home-assistant-websocket/node/device-config.html" rel="noopener noreferrer">device config documentation</a></li></ul><dd>A list of devices the entity can be associated with. This is used to group entities together in the UI.</dd><div class="home-assistant-custom-block warning"><p class="custom-block-title">Caveat</p><p>If the entity has already been registered with Home Assistant when no device was selected. The device will not be added to the Home Assistant until after Home Assistant has been restarted.</p></div><dt>Type <span text="required" class="home-assistant-badge">required</span><span class="property-type">string</span></dt><ul><li>Values: <code>binary_sensor|button|sensor|switch</code></li></ul><dt>Resend state and attributes<span class="property-type">boolean</span></dt><dd>When the entity in Home Assistant is created the state and attributes will also be set. This is only applicable with certain entities nodes.</dd><dt>Other Properties<span class="property-type"></span></dt><dd>Configuration options are available for the selected entities</dd><dd><a href="https://developers.home-assistant.io/docs/core/entity">https://developers.home-assistant.io/docs/core/entity</a></dd></dl></script>
<script type="text/html" data-help-name="ha-entity"><div class="home-assistant-custom-block danger"><p class="custom-block-title">DEPRECATED</p><p>This node has been deprecated in favor of the individual entity nodes. The individual entity nodes can be used in subflows and added to devices.</p></div><p>Creates an entity in Home Assistant which can be manipulated from this node.</p><p><code>binary sensor</code>, <code>sensor</code>, and <code>switch</code></p><div class="home-assistant-custom-block warning"><p class="custom-block-title">WARNING</p><p><em>Needs <a href="https://github.com/zachowj/hass-node-red">Custom Integration</a> installed in Home Assistant for this node to function</em></p></div><h3>Configuration</h3><dl class="message-properties"><dt>Type <span text="required" class="home-assistant-badge">required</span><span class="property-type">string</span></dt><ul><li>Values <code>binary_sensor|sensor|switch</code></li><li>Default: <code>sensor</code></li></ul><dd>The state the entity should be updated to</dd><dt>Home Assistant Config<span class="property-type">Object</span></dt><dd>Configuration options available for the selected entity</dd><div class="home-assistant-custom-block danger"><p class="custom-block-title">WARNING</p><p>Entity nodes will not work in a subflow due to the way they register themselves with Home Assistant. After a Node-RED restart, a new entity will be created in Home Assistant.</p></div></dl><h3>Sensor Configuration</h3><dl class="message-properties"><dt>State <span text="required" class="home-assistant-badge">required</span><span class="property-type">string | number | boolean</span></dt><dd>The state the entity should be updated to</dd><dt>Attributes<span class="property-type">Object</span></dt><dd>Key/Value pair of attributes to update. The key should be a string and the value can be a [string | number | boolean | object]</dd><dt>Input Override<span class="property-type">string</span></dt><ul><li>Values: <code>accept | merge | block</code></li></ul><dd>Determine how input values will be handled. When merge is selected the message object values will override the configuration values.</dd><dt>Resend state and attributes<span class="property-type">boolean</span></dt><dd>When creating the entity in Home Assistant this will also send the last updated state and attributes then node sent to Home Assistant</dd></dl><h3>Switch Configuration</h3><dl class="message-properties"><dt>Output on state change<span class="property-type">boolean</span></dt><dd>When the state of the switch changes it will output to the top if the switch is on or to the bottom if it is in the off position.</dd><dt>Payload<span class="property-type">str | num | bool | JSONata | timestamp</span></dt><dd>Customizable output set to <code>msg.payload</code> if <code>Output on state change</code> is enabled.</dd></dl><h3>Sensors Inputs</h3><dl class="message-properties"><dd>properties of <code>msg.payload</code></dd><dt>state<span class="property-type">string | number | boolean</span></dt><dd>The state the entity should be updated to</dd><dt>attributes<span class="property-type">Object</span></dt><dd>Key/Value pair of attributes to update. The key should be a string and the value can be a <code>[string | number | boolean | object]</code></dd></dl><h3>Switch Inputs</h3><dl class="message-properties"><dt>msg.enable<span class="property-type">boolean</span></dt><dd>Set to <code>true</code> to turn on the switch and <code>false</code> to turn off. If the message has a property <code>enable</code> set to the type <code>boolean</code> the node will not have any output.</dd></dl><h3>Outputs</h3><dl class="message-properties"><dd><strong>Status Color</strong></dd><ul><li>Green/Red: output from the node was due to input to the node</li><li>Blue: output from the node was due to the state of the node changing</li><li>Yellow: state of node changed but no output</li></ul></dl></script>
<script type="text/html" data-help-name="server-events"><p>This node listens for all types of events from Home Assistant, with the ability to filter by event type. It’s a powerful tool for triggering automations based on specific events occurring within Home Assistant, such as state changes, sensor readings, or user interactions.</p><h3>Configuration</h3><dl class="message-properties"><dt>Name<span class="property-type">string</span></dt><dd>the name of the node</dd><dt>Event Type<span class="property-type">string</span></dt><dd>filter by event type or leave blank for all events</dd><div class="home-assistant-custom-block danger"><p class="custom-block-title">WARNING</p><p>Leaving this empty will listen for all events from Home Assistant which may overload the WebSocket message queue.</p><p><a href="https://github.com/zachowj/node-red-contrib-home-assistant-websocket/issues/153#issuecomment-539290950">GitHub Issue #153</a></p></div><dt>Event data<span class="property-type">json</span></dt><dd>A JSON object that will be compared to the event data. If this JSON is a subset of the event data object, the event will be emitted.</dd><dt>Output only after Home Assistant is running<span class="property-type">boolean</span></dt><dd>What until Home Assistant has reported its state as <code>running</code> before outputting events. Client events will always output.</dd></dl><!-- @include: @snippets/node/expose-as.md --><h3>Outputs</h3><dl class="message-properties"><dd>Value types:</dd><ul><li><code>event data</code>: event received from Home Assistant</li><li><code>config</code>: config properties of the node</li></ul></dl><h3>Client Events</h3><dl class="message-properties"><dd>Use <code>home_assistant_client</code> as the event type to receive events from the Websocket client.</dd><dd>Events sent from the client:</dd><ul><li><strong>connecting</strong> - when trying to connect to HA</li><li><strong>connected</strong> - after the authorization has been accepted</li><li><strong>disconnected</strong> - when the socket stops attempting to connect or disconnected after having been connected</li><li><strong>error</strong> - when a disconnect happens of the WebSocket with an error</li><li><strong>states_loaded</strong> - the first time all states are loaded from HA</li><li><strong>services_loaded</strong> - the first time all services are loaded from HA</li><li><strong>running</strong> - when HA is in a running state and states have been loaded</li></ul></dl></script>
<script type="text/html" data-help-name="ha-events-calendar"><p>The Calendar node listens for events from Home Assistant's calendar integration. It triggers a flow in Node-RED when a calendar event starts or ends, allowing you to automate actions based on your calendar schedule. This node polls the configured calendar at roughly 15‑minute intervals to discover upcoming items. When a calendar item matches the configured filter it is queued and the node schedules the flow to fire at the selected moment (start or end) adjusted by the configured Offset. Behavior notes:</p><p>The node polls calendars roughly every 15 minutes to discover events, then schedules an exact trigger at the event start or end adjusted by the configured offset. Events are tracked by unique ID to prevent duplicates, recurring and overlapping occurrences are handled independently, and a Node‑RED restart rescans and recovers pending occurrences — but very last‑minute changes between polls may be missed.</p><h3>Configuration:</h3><dl class="message-properties"><dt>Entity ID <span text="required" class="home-assistant-badge">required</span><span class="property-type">string</span></dt><dd>The entity_id for the calendar that contains triggerable calendar items.</dd><dt>Relative To <span text="required" class="home-assistant-badge">required</span><span class="property-type">start | end</span></dt><ul><li>Default: <code>start</code></li></ul><dd>Whether to trigger an event at the start or end of each matching calendar item.</dd><dt>Offset <span text="required" class="home-assistant-badge">required</span><span class="property-type">number</span></dt><ul><li>Default: 0 seconds</li></ul><dd>A negative or positive amount of time to allow the event to be triggered before or after the calendar item's start/end time.</dd><dt>Filter<span class="property-type">string</span></dt><dd>A string to filter calendar items. If set, only calendar items whose summary contains this string will trigger events.</dd></dl><!-- @include: @snippets/node/expose-as.md --><h3>Outputs</h3><dl class="message-properties"><dd>Value types:</dd><ul><li><code>calendar item</code>: the calendar item object as provided by the Home Assistant API</li></ul><pre><code class="language-json">{
  "start": "2023-10-01T09:00:00-07:00", // ISO 8601 format with timezone offset
  "end": "2023-10-01T10:00:00-07:00", // ISO 8601 format with timezone offset
  "summary": "Team Meeting", // Event summary
  "description": "Weekly sync with the team", // Event description
  "location": "Conference Room A", // Event location
  "uid": "12345-abcde-67890-fghij", // Unique identifier for the event
  "recurrence_id": null, // Recurrence ID if applicable
  "rrule": null, // Recurrence rule if applicable
  "all_day": false // Boolean indicating if it's an all-day event
}
</code></pre></dl></script>
<script type="text/html" data-help-name="server-state-changed"><p>The Events: State node listens for state changes of entities within Home Assistant. It triggers a flow in Node-RED whenever an entity's state changes, allowing you to automate responses to various conditions, like turning on lights when motion is detected or sending a notification when a door is opened.</p><h3>Configuration:</h3><dl class="message-properties"><dt>Entity <span text="required" class="home-assistant-badge">required</span><span class="property-type">string</span></dt><dd>The entity ID is used to listen for state changes. This can be a entity ID, regex, or a substring. If a regex or substring is used, the node will listen for all entities that match.</dd><dd>Example:</dd><ul><li><code>light.kitchen</code> (entity) listens for state changes of the <code>light.kitchen</code> entity</li><li><code>^light.*</code> (regex) listens for state changes of all entities that start with <code>light.</code></li><li><code>light</code> (substring) listens for state changes of all entities that contain <code>light</code> in the entity ID</li></ul><dt>If State<span class="property-type">string</span></dt><dd>If the conditional is evaluated as true send the message to the first output otherwise send it to the second output. If blank there will only be one output.</dd><dd><strong>Also see:</strong></dd><ul><li><a href="https://zachowj.github.io/node-red-contrib-home-assistant-websocket/guide/conditionals.html" rel="noopener noreferrer">Conditionals</a></li></ul><dt>For<span class="property-type">number</span></dt><dd>An amount of time an entity's state needs to be in that state before triggering.</dd><div class="home-assistant-custom-block warning"><p class="custom-block-title">WARNING</p><p>Output on Connect state changes will not start a timer.</p></div><dt>State Type<span class="property-type"></span></dt><div class="home-assistant-custom-block warning"><p class="custom-block-title">DEPRECATED</p><p>This feature is being phased out and will be removed in version <strong>1.0.0</strong>.<br>Use the <strong>output properties</strong> for state conversion moving forward.</p></div><ul><li>Type: <code>string</code></li><li>Values: <code>string|number|boolean</code></li><li>Default: <code>string</code></li></ul><dd>Convert the state of the entity to the selected type. Boolean will be converted to true based on if the string is equal by default to (<code>y|yes|true|on|home|open</code>). Original value stored in msg.data.original_state</dd><dt>Ignore state change event<span class="property-type">boolean</span></dt><dd>A list of possible states that will be ignored.</dd><dt>Output on Connect<span class="property-type">boolean</span></dt><dd>Output once on startup/deploy</dd></dl><!-- @include: @snippets/node/expose-as.md --><h3>Outputs</h3><dl class="message-properties"><dd>Value types:</dd><ul><li><code>event data</code>: full event object</li><li><code>entity id</code>: entity id of the triggered entity</li><li><code>entity state</code>: entity state of the triggered entity</li><li><code>config</code>: config properties of the node</li></ul></dl></script>
<script type="text/html" data-help-name="ha-fire-event"><p>The Fire Event node allows you to fire an event on the Home Assistant event bus. This can be used to trigger automations or notify other parts of the system about specific occurrences. It’s a way to programmatically generate events that other nodes or systems can listen to and react upon.</p><h3>Configuration</h3><dl class="message-properties"><dt>Event <span text="required" class="home-assistant-badge">required</span><span class="property-type">string</span></dt><dd>Event name to fire</dd><dt>data<span class="property-type">Object</span></dt><dd>JSON object to pass along</dd></dl><h3>Inputs</h3><dl class="message-properties"><dd>If the incoming message has a <code>payload</code> property with <code>event</code> set it will override any config values if set. If the incoming message has a <code>payload.data</code> that is an object or parsable into an object these properties will be <strong>merged</strong> with any config values set. If the node has a property value in its config for <code>Merge Context</code> then the <code>flow</code> and <code>global</code> contexts will be checked for this property which should be an object that will also be merged into the data payload.</dd><dt>payload.event<span class="property-type">string</span></dt><dd>Event to fire</dd><dt>payload.data<span class="property-type">Object</span></dt><dd>Event data to send</dd></dl><h3>Outputs</h3><dl class="message-properties"><dt>payload.event_type<span class="property-type">string</span></dt><dd>Event Type that was fired</dd><dt>payload.data<span class="property-type">Object</span></dt><dd>The event <code>data</code> sent if one was used</dd></dl><h3>References</h3><dl class="message-properties"><dd><a href="https://developers.home-assistant.io/docs/en/dev_101_events.html#firing-events">Home Assistant Events</a></dd></dl></script>
<script type="text/html" data-help-name="ha-get-entities"><p>The Get Entities node retrieves entities based on specific search criteria, with three different output options. This node is useful for filtering and finding entities that match certain conditions, such as all lights that are currently on, or sensors reporting a specific range of values.</p><h3>Configuration</h3><dl class="message-properties"><dt>Search Criteria<span class="property-type"></span></dt><dd>All specified criteria must be met for an entity to be considered valid.</dd><dt>Property<span class="property-type"></span></dt><dd>Autocomplete is available for all properties currently set on loaded entities.</dd></dl><h3>Inputs</h3><dl class="message-properties"><dt>Payload<span class="property-type">Object</span></dt><dd>Override the configuration values by passing in a property with a valid value.</dd><ul><li><code>rules</code> (array)<ul><li><code>condition</code>: string (e.g., <code>state_object</code>, <code>label_registry</code>, <code>area_registry</code>, <code>device_registry</code>, <code>floor_registry</code>)</li><li><code>property</code>: string</li><li><code>logic</code>: string</li><li><code>value</code>: string</li><li><code>valueType</code>: string</li></ul></li><li><code>outputType</code>: string</li><li><code>outputEmptyResults</code>: boolean</li><li><code>outputLocationType</code>: string</li><li><code>outputLocation</code>: string</li><li><code>outputResultsCount</code>: number</li></ul><h5>Example</h5><dd>To retrieve all entities with the device class <code>battery</code> on the <code>First floor</code> that are not labeled <code>not replaceable</code>, include the following in the <code>payload</code> property of the message:</dd><pre><code class="language-json">{
  "rules": [
    {
      "condition": "state_object",
      "property": "attributes.device_class",
      "logic": "is",
      "value": "battery",
      "valueType": "str"
    },
    {
      "condition": "floor_registry",
      "property": "name",
      "logic": "is",
      "value": "First floor",
      "valueType": "str"
    },
    {
      "condition": "label_registry",
      "property": "name",
      "logic": "is_not",
      "value": "not replaceable",
      "valueType": "str"
    }
  ]
}
</code></pre></dl><h3>Outputs</h3><dl class="message-properties"><dt>Array<span class="property-type">Array</span></dt><dd>Returns an array of state objects based on the search criteria and sends them to the specified output location.</dd><dt>Count<span class="property-type">number</span></dt><dd>Returns the total count of valid entities.</dd><dt>Random<span class="property-type">Object | Array</span></dt><dd>Returns a random object or array from the available state objects. If <code>One Max Results</code> is selected, it will return a single object; otherwise, it will return an array of state objects.</dd><dt>Split<span class="property-type">msg.part</span></dt><dd>Sends a separate message for each state object, similar to the output of a split node.</dd></dl><h3>State Object Format</h3><dl class="message-properties"><dd>Sample output when the output type is an array:</dd><pre><code class="language-json">[
  {
    "entity_id": "light.kitchen",
    "state": "on",
    "attributes": {
      "brightness": 243,
      "friendly_name": "Kitchen Light",
      "supported_features": 33,
      "icon": "mdi:light-switch"
    },
    "last_changed": "2019-12-29T05:38:53.016984+00:00",
    "last_updated": "2019-12-29T05:38:53.016984+00:00",
    "context": {
      "id": "6c16e348494c42fb8c8e8bda92b20fb2",
      "parent_id": null,
      "user_id": null
    },
    "timeSinceChangedMs": 3466747
  }
]
</code></pre><dt>entity_id<span class="property-type">string</span></dt><dd>The entity to which this state belongs.</dd><dt>state<span class="property-type">string</span></dt><dd>The main attribute state value, such as 'on', 'off', 'home', 'open', 'closed', etc.</dd><dt>attributes<span class="property-type">Object</span></dt><dd>Supported attributes of the state as set by Home Assistant.</dd><dt>last_changed<span class="property-type">string</span></dt><dd>ISO Date string representing the last time the entity state changed.</dd><dt>timeSinceChangedMs<span class="property-type">number</span></dt><dd>Milliseconds since the last state change of the entity.</dd><dt>last_updated<span class="property-type">string</span></dt><dd>ISO Date string representing the last time the entity state was updated.</dd><dt>context<span class="property-type">Object</span></dt><dd>Information about who or what last changed the state of this entity.</dd></dl><h3>Examples</h3><dl class="message-properties"><div><p><a href="https://zachowj.github.io/node-red-contrib-home-assistant-websocket/node/get-entities.html#examples">link</a></p></div></dl><h3>References</h3><dl class="message-properties"><ul><li><a href="https://home-assistant.io/docs/configuration/state_object/">Home Assistant State Objects</a></li></ul></dl></script>
<script type="text/html" data-help-name="api-get-history"><p>The Get History node fetches the history of Home Assistant entities based on input criteria. This can be used to analyze past states or events, such as tracking temperature changes over time or reviewing when a door was last opened. It’s useful for creating more complex automations based on historical data.</p><h3>Configuration</h3><dl class="message-properties"><dt>Entity ID<span class="property-type">string</span></dt><dd>The entity id to fetch history for. Can be a single entity id or a comma separated list of entity ids.</dd><dt>Entity ID Type<span class="property-type">string</span></dt><ul><li>Values: <code>==</code> | <code>regex</code></li></ul><dd>The type of entity id matching to use. <code>==</code> will do an exact match, <code>regex</code> will use a regular expression to match the entity ids.</dd><dt>Start Date<span class="property-type">string</span></dt><ul><li>Values: ISO Formattted Date</li><li>Default: 24 hours prior</li></ul><dd>Date to start fetching history from. Will override the configuration if passed in. If <code>relativetime</code> is used this will be ignored.</dd><dd><strong>Also See:</strong></dd><ul><li><a href="https://en.wikipedia.org/wiki/ISO_8601">https://en.wikipedia.org/wiki/ISO_8601</a></li></ul><dt>End Date<span class="property-type">string</span></dt><ul><li>Values: ISO Formattted Date</li><li>Default: 24 hours from start date</li></ul><dd>The end date to fetch history too. Will override the configuration if passed in. If <code>relativetime</code> is used this will be ignored.</dd><dd><strong>Also See:</strong></dd><ul><li><a href="https://en.wikipedia.org/wiki/ISO_8601">https://en.wikipedia.org/wiki/ISO_8601</a></li></ul><dt>Use Relative Time<span class="property-type">boolean</span></dt><dd>A checkbox to use relative time or not. If checked the <code>startdate</code> and <code>enddate</code> will be ignored and the <code>relativetime</code> will be used instead.</dd><dt>In the Last<span class="property-type">string</span></dt><dd>A time string that will be parsed the following keywords into time values.</dd><dd>Example: <code>4h 30m</code> = The last 4 hours and 30 minutes</dd><pre><code>ms, milli, millisecond, milliseconds - will parse to milliseconds
s, sec, secs, second, seconds - will parse to seconds
m, min, mins, minute, minutes - will parse to minutes
h, hr, hrs, hour, hours - will parse to hours
d, day, days - will parse to days
w, week, weeks - will parse to weeks
mon, mth, mths, month, months - will parse to months
y, yr, yrs, year, years - will parse to years
</code></pre><dt>Flatten Results<span class="property-type"></span></dt><dd>Instead of returning the data from home assistant ( array for each entity_id ) return one flattened array of one item per history entry</dd><dt>Output Types<span class="property-type">string</span></dt><ul><li>Values: <code>array</code> | <code>split</code></li><li>Default: <code>array</code></li></ul><dd>The type of output to return. <code>array</code> will return an array of history objects. <code>split</code> will return an array of history objects for each entity id.</dd></dl><h3>Inputs</h3><dl class="message-properties"><dd>All properties of <code>msg.payload</code></dd><dt>entityId<span class="property-type">string</span></dt><dt>entityIdType<span class="property-type">equalregex</span></dt><dt>startDate<span class="property-type">string</span></dt><ul><li>Values: ISO Formattted Date</li></ul><dt>endDate<span class="property-type">string</span></dt><ul><li>Values: ISO Formattted Date</li></ul><dt>relativeTime<span class="property-type">string</span></dt><dt>flatten<span class="property-type">boolean</span></dt></dl><h3>Outputs</h3><dl class="message-properties"><dt>payload<span class="property-type">array</span></dt><dd>The history returned by home-assistant, which is an array of arrays where each array entry contains history objects for one particular entity</dd><dd>Example output of <code>msg</code>:</dd><pre><code class="language-json">{
  "payload": [
    {
      "attributes": {
        "friendly_name": "Kitchen Light",
        "icon": "mdi:light-switch",
      },
      "context": {
        "id": "850e510e36fb494c9abc79e01e897d54",
        "parent_id": null,
        "user_id": null
      },
      "entity_id": "light.kitchen_light",
      "last_changed": "2019-12-28T06:47:28.618000+00:00",
      "last_updated": "2019-12-28T06:47:28.618000+00:00",
      "state": "off"
    },
    {
      "attributes": {
        "brightness": 28,
        "friendly_name": "Kitchen Light",
        "icon": "mdi:light-switch",
      },
      "context": {
        "id": "4d4abe29f2bc43dab39101193f1fefe4",
        "parent_id": null,
        "user_id": null
      },
      "entity_id": "light.kitchen_light",
      "last_changed": "2019-12-28T07:48:11.514137+00:00",
      "last_updated": "2019-12-28T07:48:11.514137+00:00",
      "state": "on"
    },
    ...
  ]
}
</code></pre></dl><h3>Examples</h3><dl class="message-properties"><dd><a href="https://zachowj.github.io/node-red-contrib-home-assistant-websocket../cookbook/check-if-an-entity-was-turned-on-in-the-last-24-hours.html" rel="noopener noreferrer">Check if an entity was a certain state in the last 24 hours</a></dd></dl><h3>References</h3><dl class="message-properties"><ul><li><a href="https://www.home-assistant.io/integrations/history">Home Assistant History Component</a></li><li><a href="https://developers.home-assistant.io/docs/en/external_api_rest.html#get-apihistoryperiodlttimestamp">Home Assistant API: /api/history/period</a></li></ul></dl></script>
<script type="text/html" data-help-name="ha-number"><div class="home-assistant-custom-block warning"><p class="custom-block-title">WARNING</p><p><em>Needs <a href="https://github.com/zachowj/hass-node-red">Custom Integration</a> installed in Home Assistant for this node to function</em></p></div><p>The Number node creates a number entity in Home Assistant that can be manipulated from within Node-RED. This entity type is typically used to represent numeric values that can be adjusted, such as a thermostat setting or a brightness level for lights.</p><h3>Configuration</h3><dl class="message-properties"><dt>Mode <span text="required" class="home-assistant-badge">required</span><span class="property-type"></span></dt><dd>The mode of the node</dd><dt>Value <span text="required" class="home-assistant-badge">required</span><span class="property-type">number</span></dt><dd>The value of the entity should be updated to</dd></dl><h3>Inputs</h3><dl class="message-properties"><dd>properties of <code>msg.payload</code></dd><dt>value<span class="property-type">number</span></dt><dd>The value of the entity should be updated to</dd></dl><h3>Outputs</h3><dl class="message-properties"><dd>Value types:</dd><ul><li><code>value</code>: The value of the entity</li><li><code>previous value</code>: The previous value of the entity</li><li><code>config</code>: The config properties of the node</li></ul></dl><h3>Examples</h3><dl class="message-properties"><div><p><a href="https://zachowj.github.io/node-red-contrib-home-assistant-websocket/node/number.html#examples">link</a></p></div></dl></script>
<script type="text/html" data-help-name="poll-state"><p>The Poll State node outputs the state of an entity at regular intervals. It can also be configured to trigger at startup and whenever the entity changes state, if desired. This node is useful for regularly checking the status of an entity, ensuring your automations stay up to date with the latest information.</p><h3>Configuration</h3><dl class="message-properties"><dt>Entity ID <span text="required" class="home-assistant-badge">required</span><span class="property-type"></span></dt><dd>The entity id of the entity to poll for.</dd><dt>Update Interval<span class="property-type">number</span></dt><dd>The amount of time between checking/sending updates.</dd><dt>If State<span class="property-type">string</span></dt><dd>If the conditional statement is evaluated as true send the message to the first output otherwise send it to the second output. If blank there will only be one output.</dd><dd><strong>Also see:</strong></dd><ul><li><a href="https://zachowj.github.io/node-red-contrib-home-assistant-websocket/guide/conditionals.html" rel="noopener noreferrer">Conditionals</a></li></ul><dt>State Type<span class="property-type"></span></dt><div class="home-assistant-custom-block warning"><p class="custom-block-title">DEPRECATED</p><p>This feature is being phased out and will be removed in version <strong>1.0.0</strong>.<br>Use the <strong>output properties</strong> for state conversion moving forward.</p></div><ul><li>Type: <code>string</code></li></ul><dd>Convert the state of the entity to the selected type. Boolean will be converted to true based on if the string is equal by default to (y|yes|true|on|home|open). Original value stored in msg.data.original_state</dd><dt>Output on change<span class="property-type">boolean</span></dt><dd>When enabled, the node will output a message whenever the entity's state changes, in addition to the regular polling intervals. This ensures the node responds immediately to state changes that occur between polls, rather than waiting for the next scheduled poll.</dd><div class="home-assistant-custom-block tip"><p class="custom-block-title">INFO</p><p>If you only want output when the entity's state changes (without polling), use the "events: state" or "trigger: state" nodes instead.</p></div><dt>Output on connect<span class="property-type">boolean</span></dt><dd>Output once on startup/deploy then on each interval</dd></dl><!-- @include: @snippets/node/expose-as.md --><h3>Outputs</h3><dl class="message-properties"><dt>topic<span class="property-type">string</span></dt><dd>entity_id of changed entity</dd><dt>payload<span class="property-type">object</span></dt><dd>The last known state of the entity</dd><dt>data.timeSinceChanged<span class="property-type">string</span></dt><dd>Human readable format string of time since last updated, example "1 hour ago"</dd><dt>data.timeSinceChangedMs<span class="property-type">number</span></dt><dd>Number of milliseconds since last changed</dd></dl><h3>References</h3><dl class="message-properties"><ul><li><a href="https://home-assistant.io/docs/configuration/state_object/">Home Assistant State Objects</a></li></ul></dl></script>
<script type="text/html" data-help-name="api-render-template"><p>The Render Template node allows you to render templates based on input data. Templates in Home Assistant are powerful tools for dynamically generating text or values based on the state of entities or other variables. This node sends the template to Home Assistant for rendering and outputs the result.</p><div class="home-assistant-custom-block tip"><p class="custom-block-title">NOTE:</p><p>The node will output any Home Assistant API errors for catching with the 'catch-all' node</p></div><h3>Configuration</h3><dl class="message-properties"><dt>template<span class="property-type">string</span></dt><dd>Jinja template to be rendered, discarded if <code>msg.template</code> is provided via input msg</dd><dt>Template Location<span class="property-type"></span></dt><dd>Customizable location to output original template</dd><dt>Results<span class="property-type"></span></dt><dd>Customizable location to output rendered template</dd></dl><h3>Inputs</h3><dl class="message-properties"><dt>template<span class="property-type">string</span></dt><dd>Jinja template to be rendered</dd></dl><h3>Outputs</h3><dl class="message-properties"><dt>template<span class="property-type">string</span></dt><dd>The original template sent to Home Assistant for rendering</dd><dt>payload<span class="property-type">string</span></dt><dd>The rendered template</dd></dl><h3>References</h3><dl class="message-properties"><ul><li><a href="https://home-assistant.io/docs/configuration/templating/">Home Assistant Template Docs</a></li><li><a href="http://jinja.pocoo.org/docs/dev/templates/">Jinja Docs</a></li></ul></dl></script>
<script type="text/html" data-help-name="ha-select"><div class="home-assistant-custom-block warning"><p class="custom-block-title">WARNING</p><p><em>Needs <a href="https://github.com/zachowj/hass-node-red">Custom Integration</a> installed in Home Assistant for this node to function</em></p></div><p>The Select node creates a select entity in Home Assistant that can be manipulated from Node-RED. This type of entity typically represents a dropdown menu or a list of options from which the user can choose, and it can be used to control or adjust settings within your automations.</p><h3>Configuration</h3><dl class="message-properties"><dt>Mode <span text="required" class="home-assistant-badge">required</span><span class="property-type"></span></dt><dd>The mode of the node</dd><dt>value <span text="required" class="home-assistant-badge">required</span><span class="property-type">string</span></dt><dd>A string to the set current value of the select entity</dd></dl><h3>Inputs</h3><dl class="message-properties"><dd>properties of <code>msg.payload</code></dd><dt>Value<span class="property-type">string</span></dt><dd>The string of the text entity should be updated to</dd></dl><h3>Outputs</h3><dl class="message-properties"><dd>Value types:</dd><ul><li><code>value</code>: The text string of the entity</li><li><code>previous value</code>: The previous text string of the entity</li><li><code>config</code>: The config properties of the node</li></ul></dl><h3>Examples</h3><dl class="message-properties"><div><p><a href="https://zachowj.github.io/node-red-contrib-home-assistant-websocket/node/select.html#examples">link</a></p></div></dl></script>
<script type="text/html" data-help-name="ha-sensor"><div class="home-assistant-custom-block warning"><p class="custom-block-title">WARNING</p><p><em>Needs <a href="https://github.com/zachowj/hass-node-red">Custom Integration</a> installed in Home Assistant for this node to function</em></p></div><p>The Sensor node creates a sensor entity within Home Assistant that is controlled from Node-RED. Sensors are entities that report data from various sources, such as temperature, humidity, or motion detection. This node allows you to create and manage such sensors directly from your Node-RED flows.</p><h3>Configuration</h3><dl class="message-properties"><dt>State <span text="required" class="home-assistant-badge">required</span><span class="property-type">string | number | boolean</span></dt><dd>The state the entity should be updated to</dd><dd>To set the Home Assistant state to <code>Unknown</code>, send a state with a js expression <code>null</code>.</dd><dt>Attributes<span class="property-type">Object</span></dt><dd>Key/Value pair of attributes to update. The key should be a string and the value can be a [string | number | boolean | object]</dd><dt>Input Override<span class="property-type">string</span></dt><ul><li>Values: <code>accept | merge | block</code></li></ul><dd>Determine how input values will be handled. When merge is selected the message object values will override the configuration values.</dd><dt>Resend state and attributes<span class="property-type">boolean</span></dt><dd>When creating the entity in Home Assistant this will also send the last updated state and attributes then node sent to Home Assistant</dd></dl><h3>Inputs</h3><dl class="message-properties"><dd>properties of <code>msg.payload</code></dd><dt>state<span class="property-type">string | number | boolean</span></dt><dd>The state the entity should be updated to</dd><dt>attributes<span class="property-type">Object</span></dt><dd>Key/Value pair of attributes to update. The key should be a string and the value can be a <code>[string | number | boolean | object]</code></dd></dl></script>
<script type="text/html" data-help-name="ha-sentence"><p>The <strong>Sentence</strong> node is triggered when the Home Assistant <a href="https://www.home-assistant.io/voice_control/">Assist</a> feature matches a sentence from a voice assistant using the default <a href="https://www.home-assistant.io/integrations/conversation/">conversation agent</a>. This node enables voice control integrations, allowing specific voice commands to trigger automations within Node-RED.</p><p>Sentences support basic template syntax. Refer to the Home Assistant <a href="https://www.home-assistant.io/docs/automation/trigger/#sentence-trigger">documentation</a> for more details.</p><div class="home-assistant-custom-block warning"><p class="custom-block-title">WARNING</p><p>This node requires the <a href="https://github.com/zachowj/hass-node-red">Custom Integration</a> to be installed in Home Assistant.</p></div><h3>Configuration Options</h3><dl class="message-properties"><dt>Mode<span class="property-type">string</span></dt><ul><li><strong>Options</strong>:<ul><li><code>trigger</code></li><li><code>response</code></li></ul></li></ul><dd>Defines the node’s function.<br>If set to <strong>trigger</strong>, the node activates when a sentence is matched.<br>If set to <strong>response</strong>, the node sends a dynamic response back to Home Assistant.</dd><dt>Sentences<span class="property-type">string</span></dt><dd>A list of sentences to match. Supports basic template syntax. For more details, see the Home Assistant <a href="https://www.home-assistant.io/docs/automation/trigger/#sentence-trigger">documentation</a>.</dd><dt>Response Type<span class="property-type">string</span></dt><ul><li><strong>Options</strong>:<ul><li><code>dynamic</code></li><li><code>fixed</code></li></ul></li></ul><dd>Specifies the type of response sent to Home Assistant:</dd><ul><li><strong>Fixed</strong>: The same response is sent for all matched sentences.</li><li><strong>Dynamic</strong>: The response is determined by the node set to response mode.</li></ul><dt>Response<span class="property-type">string</span></dt><dd>The message sent to Home Assistant when a sentence is matched. This option is used only if the <strong>Response Type</strong> is set to <code>fixed</code>.</dd><dt>Fallback Response<span class="property-type">string</span></dt><dd>The message sent to Home Assistant when a timeout occurs. This is used when the <strong>Response Type</strong> is set to <code>dynamic</code>.</dd><dt>Response Timeout<span class="property-type">number</span></dt><dd>Specifies the time in milliseconds to wait for a response before sending the <strong>Fallback Response</strong>. This option is used only when the <strong>Response Type</strong> is set to <code>dynamic</code>.</dd><dt>Expose As<span class="property-type">string</span></dt><dd>Select an entity to create a switch in Home Assistant. Turning the switch on or off will enable or disable this node in Node-RED.</dd></dl><h3>Inputs</h3><dl class="message-properties"><dd>All properties must be provided in <code>msg.payload</code>.</dd><dd>Example input:</dd><pre><code class="language-json">{
  "response": "The light is now on"
}
</code></pre><dt>Response<span class="property-type">string</span></dt><dd>The response sent to Home Assistant when a sentence is matched. This is used only when the <strong>Response Type</strong> is set to <code>dynamic</code>.</dd></dl><h3>Outputs</h3><dl class="message-properties"><dd>Value types:</dd><ul><li><code>trigger id</code>: The sentence that triggered the flow.</li><li><code>config</code>: The node's configuration properties.</li></ul></dl><h3>Examples</h3><dl class="message-properties"><div><p>For detailed usage examples, see the <a href="https://zachowj.github.io/node-red-contrib-home-assistant-websocket/node/sentence.html#examples">Examples</a> section.</p></div></dl></script>
<script type="text/html" data-help-name="ha-switch"><div class="home-assistant-custom-block warning"><p class="custom-block-title">WARNING</p><p><em>Needs <a href="https://github.com/zachowj/hass-node-red">Custom Integration</a> installed in Home Assistant for this node to function</em></p></div><p>The Switch node creates a switch entity within Home Assistant that can be controlled from Node-RED. This node also allows a flow to be started from a service call, making it a versatile tool for both controlling devices and triggering automations.</p><h3>Configuration</h3><dl class="message-properties"><dt>Enable input<span class="property-type"></span></dt><dd>Input is disabled by default. It can be enabled by checking this option.</dd><dt>Output on state change<span class="property-type">boolean</span></dt><dd>When the state of the switch changes it will output to the top if the switch is on or to the bottom if it is in the off position.</dd></dl><h3>Inputs</h3><dl class="message-properties"><dt>msg.enable<span class="property-type">boolean</span></dt><dd>Set to <code>true</code> to turn on the switch and <code>false</code> to turn it off. If the message has a property <code>enable</code> defined and set to a <code>boolean</code> the node will not have any output.</dd></dl><h3>Outputs</h3><dl class="message-properties"><dd><strong>Status Color</strong></dd><ul><li>Green/Red: output from the node was due to input to the node</li><li>Blue: output from the node was due to the state of the node changing</li><li>Yellow: state of node changed but no output</li></ul></dl><h3>Examples</h3><dl class="message-properties"><div><p><a href="https://zachowj.github.io/node-red-contrib-home-assistant-websocket/node/switch.html#examples">link</a></p></div></dl></script>
<script type="text/html" data-help-name="ha-tag"><p>The Tag node outputs data when Home Assistant receives a tag scanned event for a configured tag ID. This node is useful for creating automations based on NFC tags or other scannable identifiers, allowing specific actions to be triggered when a tag is scanned.</p><h3>Configuration</h3><dl class="message-properties"><dt>Tags<span class="property-type">array</span></dt><dd>An array of tag ids to monitor for tag scanned events.</dd><dt>Devices<span class="property-type">array</span></dt><dd>An array of device ids to check when a configured tag is scanned.</dd></dl><!-- @include: @snippets/node/expose-as.md --><h3>Outputs</h3><dl class="message-properties"><dd>Value types:</dd><ul><li><code>event data</code>: full event object</li><li><code>tag id</code>: tag id of the tag that was scanned.</li><li><code>config</code>: config properties of the node</li></ul><dt>event object<span class="property-type">object</span></dt><table><thead><tr><th>Field</th><th>Description</th></tr></thead><tbody><tr><td>device_id</td><td>ID of the device that scanned the tag</td></tr><tr><td>tag_id</td><td>ID of the tag that was scanned</td></tr><tr><td>tag_name</td><td>Home Assistant name of the tag that was scanned</td></tr><tr><td>user_id</td><td>Home Assistant user ID on device that scanned the tag</td></tr></tbody></table></dl></script>
<script type="text/html" data-help-name="ha-text"><div class="home-assistant-custom-block warning"><p class="custom-block-title">WARNING</p><p><em>Needs <a href="https://github.com/zachowj/hass-node-red">Custom Integration</a> installed in Home Assistant for this node to function</em></p></div><p>The Text node creates a text entity within Home Assistant that can be manipulated from Node-RED. Text entities are used to store and display text values, and this node allows you to dynamically update and control these values within your automations.</p><h3>Configuration</h3><dl class="message-properties"><dt>Mode <span text="required" class="home-assistant-badge">required</span><span class="property-type"></span></dt><dd>The mode of the node</dd><dt>Text <span text="required" class="home-assistant-badge">required</span><span class="property-type">string</span></dt><dd>The string of the entity should be updated to</dd></dl><h3>Inputs</h3><dl class="message-properties"><dd>properties of <code>msg.payload</code></dd><dt>Text<span class="property-type">string</span></dt><dd>The string of the text entity should be updated to</dd></dl><h3>Outputs</h3><dl class="message-properties"><dd>Value types:</dd><ul><li><code>value</code>: The text string of the entity</li><li><code>previous value</code>: The previous text string of the entity</li><li><code>config</code>: The config properties of the node</li></ul></dl><h3>Examples</h3><dl class="message-properties"><div><p><a href="https://zachowj.github.io/node-red-contrib-home-assistant-websocket/node/text.html#examples">link</a></p></div></dl></script>
<script type="text/html" data-help-name="ha-time-entity"><div class="home-assistant-custom-block warning"><p class="custom-block-title">WARNING</p><p><em>Needs <a href="https://github.com/zachowj/hass-node-red">Custom Integration</a> installed in Home Assistant for this node to function</em></p></div><p>The Time Entity node creates a time entity within Home Assistant that can be controlled from Node-RED. This entity type is used to represent time values, such as a specific time of day or a duration, and can be used to trigger automations based on time-related conditions.</p><h3>Configuration</h3><dl class="message-properties"><dt>Mode <span text="required" class="home-assistant-badge">required</span><span class="property-type"></span></dt><dd>The mode of the node</dd><dt>Value <span text="required" class="home-assistant-badge">required</span><span class="property-type">string</span></dt><ul><li>Format: <code>HH:mm:ss</code> | <code>HH:mm</code></li></ul><dd>The value of the entity should be updated to</dd></dl><h3>Inputs</h3><dl class="message-properties"><dd>properties of <code>msg.payload</code></dd><dt>value<span class="property-type">string</span></dt><ul><li>Format: <code>HH:mm:ss</code> | <code>HH:mm</code></li></ul><dd>The value of the entity should be updated to</dd></dl><h3>Outputs</h3><dl class="message-properties"><dd>Value types:</dd><ul><li><code>value</code>: The value of the entity</li><li><code>previous value</code>: The previous value of the entity</li><li><code>config</code>: The config properties of the node</li></ul></dl><h3>Examples</h3><dl class="message-properties"><div><p><a href="https://zachowj.github.io/node-red-contrib-home-assistant-websocket/node/time-entity.html#examples">link</a></p></div></dl></script>
<script type="text/html" data-help-name="ha-time"><p>The Time node can be scheduled to trigger at a specific future date and time, based on a Home Assistant entity. This node is useful for creating time-based automations, such as triggering a notification or alarm at a specific hour.</p><h3>Configuration</h3><dl class="message-properties"><dt>Entity Id<span class="property-type">string</span></dt><dd>A Home Assistant entity to be used when scheduling the node.</dd><dt>Property<span class="property-type">string</span></dt><dd>Which property of the entity object to use to schedule the node.</dd><dd>example properties:</dd><ul><li><code>entity_id</code></li><li><code>state</code></li><li><code>attributes.date</code></li><li><code>last_updated</code></li></ul><dd>example values for the property:</dd><ul><li><code>2020-12-31T02:47:54.837Z</code></li><li><code>1609382842709</code></li><li><code>13:40</code></li><li><code>23:59:02</code></li></ul><dt>Offset<span class="property-type">number</span></dt><dd>A negative or positive number that will be added to the scheduled time.</dd><dt>Randomize time within the offset<span class="property-type">boolean</span></dt><dd>When selected the time to trigger will be random selected from the scheduled time to the +/- offset.</dd><dt>Payload<span class="property-type">string | number | boolean | object</span></dt><dd>The payload is fully customizable. The default will be a JSONata expression that outputs the entity state.</dd><dt>Repeat Daily<span class="property-type">boolean</span></dt><dd>If selected the node will only use the time portion of the date string to schedule the node and will trigger at that time each day. Otherwise, the node will only trigger once at the given day and time.</dd></dl><!-- @include: @snippets/node/expose-as.md --><h3>Outputs</h3><dl class="message-properties"><dt>topic<span class="property-type">string</span></dt><dd>The entity id in the configuration.</dd><dt>payload<span class="property-type">string | number | boolean | object</span></dt><dt>data<span class="property-type">object</span></dt><dd>The entity object of the entity in the configuration.</dd></dl></script>
<script type="text/html" data-help-name="trigger-state"><p>The Trigger: State node functions similarly to the State Changed Node but provides advanced functionality for common automation use cases. This node allows for more complex conditions and actions based on entity state changes, making it a powerful tool for creating detailed and nuanced automations.</p><h3>Configuration</h3><dl class="message-properties"><dt>Entity <span text="required" class="home-assistant-badge">required</span><span class="property-type">string</span></dt><dd>Example:</dd><ul><li><code>light.kitchen</code> (entity) listens for state changes of the <code>light.kitchen</code> entity</li><li><code>^light.*</code> (regex) listens for state changes of all entities that start with <code>light.</code></li><li><code>light</code> (substring) listens for state changes of all entities that contain <code>light</code> in the entity ID</li></ul><dt>State Type<span class="property-type"></span></dt><div class="home-assistant-custom-block warning"><p class="custom-block-title">DEPRECATED</p><p>This feature is being phased out and will be removed in version <strong>1.0.0</strong>.<br>Use the <strong>output properties</strong> for state conversion moving forward.</p></div><ul><li>Type: <code>string</code></li><li>Values: <code>string|number|boolean</code></li><li>Default: <code>string</code></li></ul><dd>Convert the state of the entity to the selected type. Boolean will be converted to true based on if the string is equal by default to (<code>y|yes|true|on|home|open</code>). Original value stored in msg.data.original_state</dd><dt>Conditions<span class="property-type"></span></dt><dd>This node has two default outputs "allowed" and "blocked". If all the conditions are true the default message will be sent to the "allowed" output otherwise, it will be sent to the "blocked" output.</dd><dd><strong>See Also:</strong></dd><ul><li><a href="https://zachowj.github.io/node-red-contrib-home-assistant-websocket/guide/conditionals.html" rel="noopener noreferrer">Conditionals</a></li></ul><dt>Custom Outputs<span class="property-type"></span></dt><dd>All the above conditions need to be true for any custom outputs to be sent, having zero conditions is a valid option. Each custom output can send the default message or a custom message. Also, each one can have its constraint on whether or not to be sent.</dd><dt>Output on connect<span class="property-type">boolean</span></dt><dd>Output once on startup/deployment.</dd><dt>Enable input<span class="property-type">boolean</span></dt><dd>Enable the input to be used to send a message to the node.</dd><dt>Output debug information<span class="property-type">boolean</span></dt><dd>Output debug information to the debug tab.</dd></dl><!-- @include: @snippets/node/expose-as.md --><h3>Input</h3><dl class="message-properties"><dd>Input is disabled by default. It can be enabled using the <code>Enable Input</code> option. Input can be used to enable/disable the node or for testing.</dd><dt>Enable / Disable<span class="property-type">string</span></dt><dd>If the incoming payload or message is a string and equal to <code>enable</code> or <code>disable</code> then set the node accordingly. Saves over restarts.</dd></dl><h3>Output</h3><dl class="message-properties"><dt>topic<span class="property-type">string</span></dt><dd>The entity_id that triggered the node</dd><dt>payload<span class="property-type">string</span></dt><dd>The state as sent by home assistant</dd><dt>data<span class="property-type">object</span></dt><dd>The original home assistant event containing <code>entity_id</code> <code>new_state</code> and <code>old_state</code> properties</dd></dl><h3>Testing</h3><dl class="message-properties"><dd>To test automation without having to manually change the state in home assistant send an input <code>payload</code> as an object which contains <code>entity_id</code>, <code>new_state</code>, and <code>old_state</code> properties. This will trigger the node as if the event came from Home Assistant.</dd><pre><code class="language-json">{
  "entity_id": "test_entity",
  "old_state": {
    "state": "on"
  },
  "new_state": {
    "state": "off"
  }
}
</code></pre></dl><h3>References</h3><dl class="message-properties"><ul><li><a href="https://home-assistant.io/docs/configuration/state_object">HA State Object</a></li></ul></dl></script>
<script type="text/html" data-help-name="ha-update-config"><p>The Update Config node allows you to update the configuration of entities within Home Assistant. This node is used for dynamically adjusting the settings of entities, ensuring they stay in sync with your automation requirements.</p><h3>Configuration</h3><dl class="message-properties"><dt>Name<span class="property-type">string</span></dt><dd>A name for the node.</dd><dt>Server<span class="property-type">string</span></dt><dd>The node id of a <a href="https://zachowj.github.io/node-red-contrib-home-assistant-websocket/node/config-server.html" rel="noopener noreferrer">Server Config</a> node.</dd><dt>Entity Config<span class="property-type">string</span></dt><dd>The node id of an <a href="https://zachowj.github.io/node-red-contrib-home-assistant-websocket/node/entity-config.html" rel="noopener noreferrer">entity config</a>. This can be overridden by the <code>payload.id</code> property on the msg object.</dd></dl><h3>Inputs</h3><dl class="message-properties"><dd>All properties must be under <code>msg.payload</code> and will be ignored if not.</dd><dt>Example input<span class="property-type"></span></dt><dd>Example of the <code>msg.payload</code> object.</dd><pre><code class="language-json">{
  "id": "d9d27ac6b4ebf78f",
  "icon": "mdi:lightbulb",
  "name": "My Light",
